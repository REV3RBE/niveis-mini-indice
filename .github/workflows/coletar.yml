name: Coleta e publicação

on:
  schedule:
    - cron: "50 11 * * *"     # uma coleta por dia, todos os dias, às 8:50 em Brasília (UTC-3)
  workflow_dispatch:           # botão "Run workflow" para coletar na hora
    inputs:
      teste:
        description: 'Teste: coleta e mostra o resultado, sem gravar nem publicar'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O cron do GitHub é só reserva (atrasa ou falha); quem dispara às 8:50 é o PC.
      # Se a coleta de hoje já foi feita, o cron não coleta de novo (uma coleta por dia).
      - name: Conferir se já coletou hoje
        id: hoje
        run: |
          hoje=$(TZ=America/Sao_Paulo date '+%Y-%m-%d')
          if [ "${{ github.event_name }}" = "schedule" ] && grep -Eq "\"coletadoEm\": *\"$hoje" dados.json; then
            echo "pular=true" >> "$GITHUB_OUTPUT"; echo "Coleta de $hoje já feita; nada a coletar."
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Coletar fechamento (B3), S&P e VIX
        if: github.event_name != 'push' && steps.hoje.outputs.pular != 'true'
        shell: pwsh
        run: ./coletar-site.ps1

      - name: Resultado do teste (nada é gravado nem publicado)
        if: inputs.teste
        run: cat dados.json

      - name: Guardar dados no repositório
        if: github.event_name != 'push' && steps.hoje.outputs.pular != 'true' && !inputs.teste
        run: |
          git config user.name "coleta-niveis"
          git config user.email "coleta-niveis@users.noreply.github.com"
          git add dados.json historico.csv
          git diff --cached --quiet || git commit -m "Coleta $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.teste }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.teste }}
        with:
          path: .

  publicar:
    needs: coletar
    if: ${{ !inputs.teste }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
